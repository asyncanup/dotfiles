# Plugins
set -g @plugin 'akohlbecker/aw-watcher-tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -sg escape-time 20

# Mouse scroll and click support
set -g mouse on

# Mouse selection leads to clipboard copy
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Allow vim keybindings in copy mode
setw -g mode-keys vi

# Fast navigation for windows
bind -n C-PageUp previous-window
bind -n C-PageDown next-window

# Fast navigation for panes
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Toggle pane fullscreen (zoom) with Alt+z
bind -n M-z resize-pane -Z

# Highlight current pane with bright border
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51,bold

# Dim inactive panes
set -g window-style fg=colour240,bg=colour235
set -g window-active-style fg=colour255,bg=colour234

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
