# Gaps (1px matching previous yabai config)
[gaps]
inner.horizontal = 1
inner.vertical = 1
outer.left = 1
outer.right = 1
outer.top = 1
outer.bottom = 1

[mode.main.binding]

# Focus windows (alt + hjkl)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Swap windows (alt + shift + hjkl)
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize windows (ctrl + shift + alt + arrows)
ctrl-shift-alt-left = 'resize width -80'
ctrl-shift-alt-right = 'resize width +80'
ctrl-shift-alt-up = 'resize height -90'
ctrl-shift-alt-down = 'resize height +90'

# Fullscreen (alt + return)
alt-enter = 'fullscreen'

# Toggle float (alt + shift + f)
alt-shift-f = 'layout floating tiling'

# Close window (alt + w)
alt-w = 'close'

# App launchers
alt-t = 'exec-and-forget open -a kitty'
alt-n = 'exec-and-forget open -a kitty --args -e nvim'
alt-m = 'exec-and-forget open -a Marta'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
